# ============================================================================
# dsh-model-balance 的 bundle patch —— 把本插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   本文件是 dsh-model-balance 这一层的「挂载声明」。DSH 启动时按 bundle 层栈
#   把各插件的 patch 叠起来组成配置树；install 之后本行会进入层栈。
#
# 【写法约束（很重要）】
#   - 插件行那一行（"id: 值"）绝不写行尾注释：外部预检用正则抓该行的值并要求
#     其后直接换行，行尾注释会让它抓不到 entry ID，整份提交被判为缺 ID。
#     所以本文件里注释只以整行形式出现，绝不挂在 id: 行尾。
#   - id 必须全局唯一且不与其他插件冲突（dsh-model-balance 与包名一致）。
#   - name: 'dsh-model-balance' 会解析到本包 package.json 的 main（host 半边）。
#   - 因为 package.json 声明了 dsh.client，DSH 的模块系统会同时把本包扫描为
#     「浏览器插件」，按 exports['./client'] 提供 /plugins/dsh-model-balance/client.js。
#
# 【配置项】
#   下面 config 的全部字段都有默认值，缺省即用默认；改动后重载生效。
#     slot        'overlay'(默认) 固定在右下角浮动徽标
#                 'sidebar'       固定显示在侧栏底部 Settings 旁
#     refreshSec  余额自动刷新间隔（秒），默认 600；倒计时不受它影响（本地每秒算）
#     hoverPrices 悬停详情里是否展示单价表，默认 true
# ============================================================================

- insert:
    - id: dsh-model-balance
      name: 'dsh-model-balance'
      config:
        slot: overlay
        refreshSec: 600
        hoverPrices: true
